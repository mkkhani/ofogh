:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#dde3ea;--pr:#0f4c81;--prt:#fff;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12161c;--card:#1c232c;--tx:#e8edf3;--mu:#97a3b3;--bd:#2d3744;--pr:#4f8bff;--prt:#fff;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12161c;--card:#1c232c;--tx:#e8edf3;--mu:#97a3b3;--bd:#2d3744;--pr:#4f8bff;--prt:#fff;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) var(--bgimg) center/cover fixed no-repeat;color:var(--tx);font-family:Yekan,Tahoma,sans-serif;font-size:15px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;background:linear-gradient(135deg,#0b2545 0%,#13538a 60%,#f59e0b 135%);color:#fff;border-bottom:3px solid #f59e0b}
header h1{font-size:18px;margin:0 0 0 12px}
nav{display:flex;gap:6px;flex-wrap:wrap}
button,input,select{font:inherit;color:inherit}
nav button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;padding:7px 14px;border-radius:8px;cursor:pointer}
nav button.on{background:#f59e0b;color:#1b2430;border-color:#f59e0b}
main{max-width:1000px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.k{color:var(--mu);font-size:13px}.v{font-size:21px;font-weight:700;margin-top:4px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
h2{font-size:16px;margin:0 0 10px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:13px}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;max-width:100%}
td input{width:90px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--pr);color:var(--prt);border:0;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:600}
.btn.g{background:transparent;color:var(--bad);border:1px solid var(--bd);padding:4px 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--bg);border-radius:20px;padding:8px 14px;cursor:pointer}
.chip:hover{border-color:var(--pr)}
#inv{display:none}
/* انتخاب خدمات به‌صورت پنجره‌ای و فشرده */
#servicePicker{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:70;padding:14px;overflow:auto}
#servicePicker .picker-box{max-width:720px;margin:4vh auto;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:0 18px 55px rgba(0,0,0,.28)}
#servicePicker .picker-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
#servicePicker .picker-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:7px;max-height:58vh;overflow:auto;padding:2px}
#servicePicker .service-option{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:right;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:9px 10px;cursor:pointer;min-width:0}
#servicePicker .service-option:hover{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 8%,var(--bg))}
#servicePicker .service-option b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#servicePicker .service-option small{font-size:11px;color:var(--mu);white-space:nowrap}
.sale-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sale-tools .btn{padding:7px 12px}
.sale-items th,.sale-items td{padding:5px 5px;font-size:13px}
.sale-items input{padding:5px 6px;width:76px}
.sale-items td:nth-child(2){max-width:180px;overflow:hidden;text-overflow:ellipsis}
@media(max-width:600px){#servicePicker{padding:7px}#servicePicker .picker-box{margin:2vh auto;padding:10px}#servicePicker .picker-list{grid-template-columns:1fr 1fr;gap:6px}.sale-tools>*{flex:1 1 auto}}

#alarmBar{display:none;background:#dc2626;color:#fff;padding:9px 12px;text-align:center;font-weight:700;animation:alp 1.6s infinite}
@keyframes alp{50%{background:#b91c1c}}
#paperAsk,#paperAlarm{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:80;padding:14px;overflow:auto}
#paperAlarm{z-index:90}
.sale-items td .sh{width:64px}
.iv .hd{gap:5mm}
.iv .ic{display:flex;flex-direction:column;align-items:center;gap:1.5mm;text-align:center}
.iv .icl{background:#ffcb05;color:#111;font-weight:700;font-size:20px;border-radius:50%/60%;padding:1.5mm 7mm;border:.6mm solid #fff}
.iv .icimg{height:14mm;max-width:34mm;object-fit:contain;background:#fff;border-radius:3mm;padding:1mm}
.iv .ict{font-size:11px;line-height:1.7}
.iv .so{display:flex;justify-content:center;align-items:flex-start;gap:9mm;margin-top:7mm}
.iv .so div{display:flex;flex-direction:column;align-items:center;gap:1.5mm;font-size:12px;font-weight:700;color:#0b2545}
.iv .so svg{width:12mm;height:12mm;display:block}
#dpk{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:100;padding:14px;overflow:auto}
.dpg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0;text-align:center}
.dpg b{color:var(--mu);font-size:12px;padding:4px 0}
.dpg button{border:1px solid transparent;background:var(--bg);border-radius:8px;padding:8px 0;cursor:pointer}
.dpg button:hover{border-color:var(--pr)}.dpg .sel{background:var(--pr);color:var(--prt)}.dpg .tdy{border-color:var(--warn)}.dpg .fri{color:var(--bad)}

.card{background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 28px rgba(10,30,70,.10);border-radius:16px}
.grid .card{transition:transform .2s,box-shadow .2s}.grid .card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(10,30,70,.18)}
.btn{background:linear-gradient(135deg,var(--pr),color-mix(in srgb,var(--pr) 65%,#7c3aed));box-shadow:0 3px 10px rgba(15,76,129,.25);transition:filter .15s,transform .1s}.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}.btn.g{background:transparent;box-shadow:none}
header{box-shadow:0 6px 22px rgba(0,0,0,.25);position:sticky;top:0;z-index:40}
nav button{transition:background .15s}nav button:hover{background:rgba(255,255,255,.2)}
tr:hover td{background:color-mix(in srgb,var(--pr) 6%,transparent)}
#ts{z-index:300}
#nk{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:85;padding:14px}
.rc{width:72mm;padding:3mm;font-size:12px;line-height:1.7;direction:rtl;background:#fff;color:#000;font-family:Yekan,Tahoma,sans-serif}.rc hr{border:0;border-top:1px dashed #000;margin:2mm 0}
#pv{zoom:.6}
.iv{width:210mm;min-height:296mm;background:#fff;color:#111;font-family:Yekan,Tahoma,sans-serif;direction:rtl;position:relative;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:13px}
.iv .hd{background:linear-gradient(135deg,#0b2545 0%,#13538a 65%,#f59e0b 140%);color:#fff;padding:12mm 14mm;display:flex;justify-content:space-between;align-items:center;border-bottom:3mm solid #f59e0b}
.iv .hl{display:flex;gap:10px;align-items:center}.iv .sn{font-size:26px;font-weight:700}.iv .ss{font-size:12px;opacity:.85;margin-top:2px}.iv .ht{font-size:22px;font-weight:700;border:2px solid #f59e0b;border-radius:8px;padding:6px 16px;color:#fde68a}
.iv .bd{padding:10mm 14mm 40mm}
.iv .mt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8mm}
.iv .mt div{background:#f1f5f9;border-radius:8px;padding:6px 10px}.iv .mt span{display:block;color:#64748b;font-size:11px}.iv .mt b{font-size:14px}
.iv table.it{width:100%;border-collapse:collapse}

<script>
const KEY='cafenet_v1';
const DEF={services:[
{id:1,n:'کپی A4',p:2000,c:400,u:1},{id:2,n:'پرینت سیاه‌سفید',p:3000,c:500,u:1},
{id:3,n:'پرینت رنگی',p:10000,c:3000,u:1},{id:4,n:'اسکن',p:5000,c:0,u:0},
{id:5,n:'نوبت‌دهی',p:50000,c:0,u:0},{id:6,n:'خدمات تعویض پلاک',p:300000,c:0,u:0}],
paper:{stock:500,low:50},sales:[],exp:[],printJobs:[],nid:10};

try{S=JSON.parse(localStorage.getItem(KEY))||DEF}catch(e){S=DEF}
S.shop=S.shop||{name:'کافی‌نت افق',phone:'09222137612',addr:''};
S.shop.phone=S.shop.phone||'09222137612';
S.shop.logo=S.shop.logo||'';S.printJobs=S.printJobs||[];
const norm=()=>{S.people=S.people||[];S.pays=S.pays||[];S.cash=S.cash||{};S.sup=S.sup||[];S.seq=S.seq||0};norm();

if(S.services.some(s=>!s.k)){S.services.forEach(s=>{if(!s.k)s.k=rc()});save()}

const nf=n=>Math.round(n).toLocaleString('fa-IR');
const day=t=>new Date(t).toDateString();
const jd=t=>new Date(t).toLocaleDateString('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric'});
const jt=t=>new Date(t).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab='dash',cart=[],cust='',custTitle='جناب آقای',disc=0,pay='نقد',paid=0,editId=null,nkP=null,cdy=null;
const tabs=[['dash','داشبورد امروز'],['sale','فاکتور جدید'],['svc','خدمات و چاپ A4'],['stock','موجودی و مواد'],['cus','مشتریان و بدهی'],['cash','صندوق'],['exp','هزینه‌ها'],['db','بانک اطلاعات'],['hist','گزارش‌ها'],['set','تنظیمات']];

function go(t){tab=t;render()}
function today(){const d=day(Date.now());const s=S.sales.filter(x=>day(x.t)==d),e=S.exp.filter(x=>day(x.t)==d);
const rev=s.reduce((a,x)=>a+x.total,0),cost=s.reduce((a,x)=>a+x.cost,0),ex=e.reduce((a,x)=>a+x.a,0);
return{s,e,rev,cost,ex,profit:rev-cost-ex}}
function render(){nav();$('#brandMarkBox').innerHTML=S.shop.logo?`<img src="${S.shop.logo}" alt="لوگو" style="width:38px;height:38px;object-fit:contain;border-radius:8px;background:#fff">`:`<svg width="38" height="38" viewBox="0 0 34 34"><circle cx="17" cy="20" r="9" fill="#f59e0b"/><rect y="20" width="34" height="14" fill="#0b2545"/><path d="M2 21h30" stroke="#fff" stroke-width="2"/></svg>`;$('#hn').textContent=S.shop.name;$('#lkb').style.display=S.shop.pass?'':'none';({dash,sale,svc,stock,cus:cusTab,cash:cashTab,exp,db,hist,set})[tab]()}
function dash(){const T=today(),low=S.paper.stock<=S.paper.low;
$('#app').innerHTML=`<div class="k" style="margin-bottom:10px">${jd(Date.now())}</div>
<div class="grid">
<div class="card"><div class="k">مشتری امروز</div><div class="v">${nf(T.s.length)}</div></div>
<div class="card"><div class="k">دخل امروز</div><div class="v">${fmt(T.rev)}</div></div>
<div class="card"><div class="k">هزینه امروز</div><div class="v bad">${fmt(T.ex)}</div></div>
<div class="card"><div class="k">سود خالص امروز</div><div class="v ${T.profit>=0?'ok':'bad'}">${fmt(T.profit)}</div></div>
<div class="card"><div class="k">کاغذ A4 باقی‌مانده</div><div class="v ${low?'warn':''}">${nf(S.paper.stock)} برگ</div>${low?'<div class="warn k">موجودی کم است!</div>':''}</div>${dashExtra(T)}</div>
<div class="card"><h2>فاکتورهای امروز</h2><div class="wrap"><table><tr><th>شماره</th><th>ساعت</th><th>مشتری</th><th>مبلغ</th><th></th></tr>
${T.s.map(x=>`<tr><td>${pd(x.id)}</td><td>${jt(x.t)}</td><td>${esc(customerName(x))}</td><td>${fmt(x.total)}</td><td><button class="btn g" style="color:var(--pr)" onclick="reprint(${x.id})">چاپ</button> <button class="btn g" style="color:var(--pr)" onclick="editSale(${x.id})">ویرایش</button></td></tr>`).join('')||'<tr><td colspan=5 class="k">هنوز فاکتوری ثبت نشده</td></tr>'}</table></div></div>
<div class="k">سود خالص = دخل − بهای تمام‌شده خدمات − هزینه‌های روز</div>`}
let q1='',q2='';
const pd=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const nz=s=>String(s==null?'':s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/ي/g,'ی').replace(/ك/g,'ک').toLowerCase().trim();
const fsv=q=>{q=nz(q);return S.services.filter(s=>!q||nz(s.n).includes(q)||nz(s.k).includes(q))};
const sortedServices=q=>fsv(q).sort((a,b)=>String(a.n).localeCompare(String(b.n),'fa'));
function openServicePicker(){const m=$('#servicePicker');m.style.display='block';$('#serviceSearch').value=q2;renderServicePicker();setTimeout(()=>$('#serviceSearch').focus(),30)}
function closeServicePicker(){$('#servicePicker').style.display='none'}
function renderServicePicker(){const l=sortedServices(q2);$('#servicePickerList').innerHTML=l.map(s=>`<button class="service-option" onclick="add(${s.id})"><b>${esc(s.n)}</b><small>${nf(s.p)} تومان · ${pd(s.k)}</small></button>`).join('')||'<div class="k">خدمتی پیدا نشد</div>'}
function upTot(){const sub=cart.reduce((a,x)=>a+x.q*x.p,0);$('#tot').textContent='مبلغ نهایی: '+fmt(Math.max(0,sub-disc))}
function sale(){const sub=cart.reduce((a,x)=>a+x.q*x.p,0);
$('#app').innerHTML=`<div class="card" style="padding:10px 12px"><div class="sale-tools"><button class="btn" onclick="openServicePicker()">＋ انتخاب خدمت</button><span class="k">${nf(cart.length)} قلم در فاکتور</span><button class="btn g" style="color:var(--pr)" onclick="repeatLast()">تکرار آخرین فاکتور</button>${editId?`<b class="warn">ویرایش فاکتور ${pd(editId)}</b><button class="btn g" onclick="cancelEdit()">لغو ویرایش</button>`:''}<span class="k" style="margin-right:auto">برای افزودن خدمات، پنجره انتخاب را باز کنید.</span></div></div>
<div class="card" style="padding:10px 12px"><h2>اقلام فاکتور</h2><div class="wrap"><table class="sale-items"><tr><th>کد</th><th>خدمت</th><th>تعداد</th><th>قیمت واحد</th><th>جمع</th><th>برگ A4</th><th></th></tr>
${cart.map((x,i)=>`<tr><td>${x.k?pd(x.k):'—'}</td><td title="${esc(x.n)}">${esc(x.n)}</td><td><input type="number" min="1" value="${x.q}" onchange="cart[${i}].q=Math.max(1,+this.value||1);sale()"></td><td><input type="number" min="0" value="${x.p}" onchange="cart[${i}].p=+this.value||0;sale()"></td><td>${fmt(x.q*x.p)}</td><td>${(+x.u||0)>0?nf(paperOf(x)):`<input class="sh" type="number" min="0" value="${+x.sh||0}" onchange="cart[${i}].sh=Math.max(0,Math.floor(+this.value||0));sale()">`}</td><td><button class="btn g" onclick="cart.splice(${i},1);sale()">حذف</button></td></tr>`).join('')||'<tr><td colspan=7 class="k">هنوز خدمتی انتخاب نشده است.</td></tr>'}</table></div>
<div class="row" style="margin-top:10px"><select id="ct" aria-label="عنوان مشتری" onchange="custTitle=this.value"><option ${custTitle==='جناب آقای'?'selected':''}>جناب آقای</option><option ${custTitle==='سرکار خانم'?'selected':''}>سرکار خانم</option><option ${custTitle==='شرکت'?'selected':''}>شرکت</option><option ${custTitle==='اداره'?'selected':''}>اداره</option><option value="" ${custTitle===''?'selected':''}>بدون عنوان</option></select><input id="cu" list="pl" placeholder="نام مشتری (اختیاری)" value="${esc(cust)}" oninput="cust=this.value"><datalist id="pl">${S.people.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist><input id="dc" type="number" min="0" placeholder="تخفیف" value="${disc||''}" oninput="disc=+this.value||0;upTot()">
<b id="tot">مبلغ نهایی: ${fmt(Math.max(0,sub-disc))}</b></div><div class="row" style="margin-top:8px"><select id="pm" onchange="pay=this.value;sale()">${['نقد','کارت','نسیه'].map(m=>`<option ${pay==m?'selected':''}>${m}</option>`).join('')}</select>${pay==='نسیه'?`<input type="number" min="0" placeholder="پرداختی همین الان" value="${paid||''}" oninput="paid=+this.value||0">`:''}<button class="btn" onclick="finish(true)">F8 · ذخیره و چاپ</button><button class="btn" style="background:var(--ok)" onclick="finish(false)">F9 · فقط ذخیره</button></div></div>`}
const paperOf=it=>(+it.q||0)*(+it.u||0)+(+it.sh||0);
let paperRes=null;
function askPaper(name){return new Promise(res=>{const m=$('#paperAsk');$('#paTitle').textContent='برای «'+name+'» از چاپ A4 استفاده کردید؟';
$('#paStep1').style.display='flex';$('#paStep2').style.display='none';$('#paQty').value=1;m.style.display='block';
const done=n=>{m.style.display='none';paperRes=null;res(n)};paperRes=done;
$('#paYes').onclick=()=>{$('#paStep1').style.display='none';$('#paStep2').style.display='block';$('#paQty').focus();$('#paQty').select()};
$('#paNo').onclick=()=>done(0);$('#paBack').onclick=()=>{$('#paStep2').style.display='none';$('#paStep1').style.display='flex'};
$('#paOk').onclick=()=>{const n=Math.floor(+$('#paQty').value||0);if(n<1){toast('تعداد برگ باید حداقل ۱ باشد');return}done(n)};
$('#paQty').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#paOk').click()}}})}
async function add(id){const s=S.services.find(x=>x.id==id);if(!s)return;const u=+s.u||0;let sh=0;if(u===0)sh=await askPaper(s.n);
const l=cart.find(x=>x.id==id);if(l){l.q++;l.sh=(+l.sh||0)+sh}else cart.push({id,k:s.k,n:s.n,q:1,p:s.p,c:s.c,u,sh,sp:s.sp,sq:s.sq});
const pickerOpen=$('#servicePicker').style.display==='block';sale();if(pickerOpen){$('#servicePicker').style.display='block';renderServicePicker();$('#serviceSearch').focus()} }
function beep(){try{const A=new (window.AudioContext||window.webkitAudioContext)(),t=A.currentTime;[0,.28,.56].forEach(d=>{const o=A.createOscillator(),g=A.createGain();o.type='square';o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(A.destination);o.start(t+d);o.stop(t+d+.18)})}catch(e){}}
function paperMsg(){const p=S.paper;return p.stock<=0?'کاغذ A4 تمام شد!':'موجودی کاغذ A4 کم است: '+nf(p.stock)+' برگ (حد هشدار: '+nf(p.low)+' برگ)'}
function alarmBar(){const b=$('#alarmBar');if(!b)return;const m=[];if(S.paper.stock<=S.paper.low)m.push(paperMsg());(S.sup||[]).forEach(x=>{if(x.stock<=x.low)m.push(x.name+' رو به اتمام است ('+nf(x.stock)+')')});b.style.display=m.length?'block':'none';if(m.length)b.textContent='⚠️ '+m.join(' | ');
const k=$('#bkBar');if(k){const old=!S.lastBk||Date.now()-S.lastBk>7*864e5;k.style.display=old&&S.sales.length?'block':'none';k.innerHTML='💾 بیش از ۷ روز از آخرین پشتیبان‌گیری گذشته. <button class="btn" style="margin-right:8px" onclick="go(\'set\')">رفتن به تنظیمات</button>'}}
function checkAlarm(){if(S.paper.stock>S.paper.low)return;$('#pAlTitle').textContent=S.paper.stock<=0?'کاغذ تمام شد!':'هشدار موجودی کاغذ';$('#pAlMsg').textContent=paperMsg();$('#paperAlarm').style.display='block';beep()}
function genId(){let k;do{k=(S.seq=(S.seq||0)+1)}while(S.sales.some(x=>x.id==k));return k}
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>{t.style.display='none'},2600)}
function finish(pr){if(!cart.length){toast('فاکتور خالی است');return}
const old=editId?S.sales.find(x=>x.id==editId):null,oldP=old?old.items.reduce((a,x)=>a+paperOf(x),0):0,need=cart.reduce((a,x)=>a+paperOf(x),0),sub=cart.reduce((a,x)=>a+x.q*x.p,0),total=Math.max(0,sub-disc),nm=cust.trim();
if(pay==='نسیه'&&!nm){toast('برای فاکتور نسیه نام مشتری لازم است');return}
if(need>S.paper.stock+oldP&&!confirm('کاغذ مصرفی ('+nf(need)+' برگ) از موجودی ('+nf(S.paper.stock+oldP)+' برگ) بیشتر است. ادامه می‌دهید؟'))return;
let pid=null;if(nm){let p=S.people.find(x=>x.name==nm);if(!p){p={id:Date.now(),name:nm,phone:''};S.people.push(p)}pid=p.id}
if(old){S.paper.stock+=oldP;useSup(old.items,-1);S.sales.splice(S.sales.indexOf(old),1)}
const sl={id:old?old.id:genId(),t:old?old.t:Date.now(),cust,custTitle,pid,pay,paid:pay==='نسیه'?Math.min(paid,total):total,items:cart,disc,total,cost:cart.reduce((a,x)=>a+x.q*x.c,0)};
S.paper.stock=Math.max(0,S.paper.stock-need);useSup(cart,1);S.sales.push(sl);save();
cart=[];cust='';custTitle='جناب آقای';disc=0;pay='نقد';paid=0;editId=null;sale();

function g2j(gy,gm,gd){const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];const gy2=gm>2?gy+1:gy;let days=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+gdm[gm-1];let jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);const jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1;const sal=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13&&gd>sal[gm];gm++)gd-=sal[gm];return[gy,gm,gd]}
const tj=t=>{const d=new Date(t);return g2j(d.getFullYear(),d.getMonth()+1,d.getDate())};
const jdim=(y,m)=>{if(m<=6)return 31;if(m<=11)return 30;const g=j2g(y,12,30),j=g2j(g[0],g[1],g[2]);return j[0]==y&&j[1]==12&&j[2]==30?30:29};

${window.desktop?`<div class="card"><h2>به‌روزرسانی برنامه</h2><div class="k">فایل index.html جدید را که از چت دریافت کرده‌اید انتخاب کنید. اطلاعات شما حفظ می‌شود.</div><div class="k" style="margin-top:6px">نسخه‌ی فعلی: ${VER}</div><div class="row" style="margin-top:8px"><input style="min-width:280px;flex:1" placeholder="آدرس فایل آنلاین (https://...)" value="${esc(S.shop.updUrl||'')}" onchange="S.shop.updUrl=this.value.trim();save()"><button class="btn" onclick="chkUpd(true)">بررسی به‌روزرسانی آنلاین</button></div><div class="row" style="margin-top:8px"><button class="btn" onclick="$('#updF').click()">انتخاب فایل و به‌روزرسانی</button><input id="updF" type="file" accept=".html,text/html" style="display:none" onchange="updFile(this)"><button class="btn g" onclick="confirm('بازگشت به نسخه‌ی اولیه نصب‌شده؟')&&desktop.resetUI()">بازگشت به نسخه‌ی نصب‌شده</button></div></div>`:''}
<div class="card"><h2>نوع چاپ و قفل برنامه</h2><div class="row"><span>اندازه‌ی فاکتور:</span><select onchange="S.shop.rec=this.value==='1';save()"><option value="0" ${S.shop.rec?'':'selected'}>A4</option><option value="1" ${S.shop.rec?'selected':''}>رسید ۸۰ میلی‌متری (حرارتی)</option></select></div><div class="row" style="margin-top:10px"><input id="np" type="password" placeholder="رمز جدید"><button class="btn" onclick="setPass()">${S.shop.pass?'تغییر رمز':'فعال‌سازی قفل'}</button>${S.shop.pass?'<button class="btn g" onclick="rmPass()">حذف رمز</button>':''}</div><div class="k" style="margin-top:6px">قفل فقط جلوی ورود اتفاقی را می‌گیرد و اطلاعات را رمزنگاری نمی‌کند.</div></div>
<div class="card"><h2>پشتیبان‌گیری و بازیابی</h2>${window.desktop?`<div class="k">همه‌ی خدمات، فاکتورها، هزینه‌ها و تنظیمات در یک فایل ذخیره می‌شود. فایل را جای امنی (فلش یا ایمیل) نگه دارید تا اگر برنامه پاک شد، دوباره بازیابی کنید. برنامه خودش هم هر روز یک نسخه در پوشه‌ی Documents > Ofogh Cafenet Backups ذخیره می‌کند.</div><div class="row" style="margin-top:8px"><button class="btn" onclick="bkSave()">ذخیره‌ی بکاپ در فایل</button><button class="btn" onclick="bkLoad()">بازیابی از فایل بکاپ</button></div>`:`<button class="btn" onclick="dlBackup()">⬇ دانلود فایل پشتیبان</button><div class="k" style="margin-top:8px">متن زیر را کپی و نگه دارید. برای بازیابی، آن را در کادر دوم بچسبانید.</div>
<textarea readonly style="width:100%;height:80px;margin:8px 0;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px">${esc(JSON.stringify(S))}</textarea>
<textarea id="bk" placeholder="پشتیبان را اینجا بچسبانید" style="width:100%;height:60px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px"></textarea>
<button class="btn" style="margin-top:8px" onclick="try{S=JSON.parse($('#bk').value);norm();save();render()}catch(e){alert('فایل پشتیبان معتبر نیست')}">بازیابی</button>`}</div>`}
function uploadLogo(input){const f=input.files&&input.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('لطفاً یک فایل تصویری انتخاب کنید');return}if(f.size>3*1024*1024){alert('حجم لوگو باید کمتر از ۳ مگابایت باشد');return}const r=new FileReader();r.onload=()=>{S.shop.logo=String(r.result);save();set();toast('لوگو ذخیره شد')};r.readAsDataURL(f)}
function uploadIc(input){const f=input.files&&input.files[0];if(!f)return;if(!f.type.startsWith('image/')||f.size>3*1024*1024){alert('یک تصویر کمتر از ۳ مگابایت انتخاب کنید');return}const r=new FileReader();r.onload=()=>{S.shop.icLogo=String(r.result);save();set();toast('لوگوی ایرانسل ذخیره شد')};r.readAsDataURL(f)}
function removeLogo(){if(!S.shop.logo)return;if(!confirm('لوگوی فعلی حذف شود؟'))return;S.shop.logo='';save();set()}
async function bkSave(){const d=new Date().toISOString().slice(0,10);const p=await desktop.saveBackup(JSON.stringify({app:'ofogh-cafenet',v:1,data:S}),`ofogh-backup-${d}.json`);if(p){S.lastBk=Date.now();save()}if(p)alert('بکاپ ذخیره شد:\n'+p)}
async function bkLoad(){const t=await desktop.loadBackup();if(!t)return;try{const j=JSON.parse(t),D=j.data||j;if(!Array.isArray(D.services)||!Array.isArray(D.sales))throw 0;if(!confirm('اطلاعات فعلی با بکاپ جایگزین می‌شود. ادامه؟'))return;S=D;S.shop=S.shop||{name:'کافی‌نت افق',phone:'09222137612',addr:''};
S.shop.phone=S.shop.phone||'09222137612';
S.shop.logo=S.shop.logo||'';S.printJobs=S.printJobs||[];norm();S.exp=S.exp||[];S.paper=S.paper||{stock:0,low:50};S.nid=S.nid||100;save();render();alert('بازیابی انجام شد')}catch(e){alert('فایل بکاپ معتبر نیست')}}
const VER=(document.querySelector('meta[name=app-version]')||{}).content||'0';
let pend=null;
async function chkUpd(manual){const u=(S.shop.updUrl||'').trim();
if(!window.desktop||!u){if(manual)alert(window.desktop?'ابتدا آدرس به‌روزرسانی را وارد کنید':'این بخش فقط در نسخه‌ی ویندوزی کار می‌کند');return}
if(!u.startsWith('https://')){if(manual)alert('آدرس باید با https:// شروع شود');return}
try{const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const t=await r.text();
const m=t.match(/name="app-version" content="([^"]+)"/);if(!m||!t.includes('cafenet_v1'))throw 0;
if(newer(m[1],VER)){pend=t;const b=$('#upd');b.style.display='block';b.innerHTML='نسخه‌ی جدید ('+esc(m[1])+') آماده است <button class="btn" style="margin-right:10px" onclick="applyUpd()">به‌روزرسانی همین حالا</button>'}
else if(manual)alert('برنامه به‌روز است')}
catch(e){if(manual)alert('دریافت به‌روزرسانی ممکن نشد. اینترنت و آدرس را بررسی کنید.')}}
const newer=(a,b)=>String(a).localeCompare(String(b),'en',{numeric:true})>0;
async function applyHtml(t){try{if(!window.desktop||typeof desktop.applyUI!=='function'){alert('این قابلیت فقط در نسخه‌ی ویندوزی وجود دارد');return}
const r=await desktop.applyUI(t);if(r&&r.ok===false)alert('به‌روزرسانی انجام نشد: '+(r.why||r.error||'نامشخص'));else setTimeout(()=>location.reload(),600)}catch(e){alert('خطا در به‌روزرسانی: '+(e&&e.message||e))}}
async function applyUpd(){if(pend)await applyHtml(pend)}
function updFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{const t=String(r.result),m=t.match(/name="app-version" content="([^"]+)"/);
if(!m||!t.includes('cafenet_v1')){alert('این فایل، فایل معتبر برنامه نیست (index.html درست را انتخاب کنید)');inp.value='';return}
if(!confirm('به‌روزرسانی از نسخه‌ی '+VER+' به نسخه‌ی '+m[1]+'؟ اطلاعات شما حفظ می‌شود.')){inp.value='';return}await applyHtml(t);inp.value=''};r.readAsText(f,'utf-8')}
/*SYNC-BEGIN*/
const AR={sales:'sales',svc:'services',ppl:'people',pay:'pays',sup:'sup',job:'printJobs',exp:'exp'};
const LOCALK=['printer','updUrl','pass','rec'];
const EK=x=>x.t+'_'+x.a,KF=c=>c=='exp'?EK:(x=>x.id);
function ap(S,o){
 if(o.c=='stock'){S.paper.stock+=o.v;return}
 if(o.c=='low'){S.paper.low=o.v;return}
 if(o.c=='shop'||o.c=='cash'){const M=o.c=='cash'?(S.cash=S.cash||{}):(S.shop=S.shop||{});if(o.v===undefined)delete M[o.k];else M[o.k]=o.v;return}
 const f=AR[o.c];if(!f)return;const A=S[f]=S[f]||[],kf=KF(o.c),i=A.findIndex(x=>kf(x)==o.k);
 if(o.r===null){if(i>-1)A.splice(i,1);return}
 if(i<0){A.push(o.r);return}
 A[i]=(o.ds!==undefined)?Object.assign({},o.r,{stock:(+A[i].stock||0)+o.ds}):o.r}
const cl=o=>JSON.parse(JSON.stringify(o));
function df(S,P){const ops=[];
 for(const c in AR){const f=AR[c],kf=KF(c),m=new Map((P[f]||[]).map(x=>[kf(x),x])),n=new Set();
  (S[f]||[]).forEach(x=>{const k=kf(x),p=m.get(k);n.add(k);
   if(!p){ops.push({c,k,r:x});return}
   if(JSON.stringify(x)!==JSON.stringify(p)){const o={c,k,r:x};if(c=='sup')o.ds=(+x.stock||0)-(+p.stock||0);ops.push(o)}});
  m.forEach((p,k)=>{if(!n.has(k))ops.push({c,k,r:null})})}
 [['shop',S.shop||{},P.shop||{}],['cash',S.cash||{},P.cash||{}]].forEach(([c,a,b])=>{
  new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{if(c=='shop'&&LOCALK.includes(k))return;
   if(JSON.stringify(a[k])!==JSON.stringify(b[k]))ops.push({c,k,v:a[k]})})});
 const d=S.paper.stock-P.paper.stock;if(d)ops.push({c:'stock',v:d});
 if(S.paper.low!==P.paper.low)ops.push({c:'low',v:S.paper.low});
 return ops}
const lg=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const SY={cid:lg('cafenet_cid')||('c'+Math.random().toString(36).slice(2,10)),seq:+lg('cafenet_seq')||0,snap:null,cfg:null,busy:0,st:'off',ui:null};
try{SY.snap=JSON.parse(lg('cafenet_snap'))}catch(e){}
try{localStorage.setItem('cafenet_cid',SY.cid)}catch(e){}
let dirty=false,stm=0;
function persist(){try{if(SY.snap){localStorage.setItem('cafenet_snap',JSON.stringify(SY.snap));localStorage.setItem('cafenet_seq',SY.seq)}else{localStorage.removeItem('cafenet_snap');localStorage.removeItem('cafenet_seq')}}catch(e){}}
function syncSoon(){clearTimeout(stm);stm=setTimeout(tick,400)}
const typing=()=>{const a=document.activeElement;return !!a&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName)};
function setSt(t){SY.st=t;const m=t=='ok'?['🟢 همگام','متصل و همگام است ✅']:t=='off'?['🔴 قطع','ارتباط برقرار نیست؛ تغییرات ذخیره می‌شود و بعداً ارسال می‌شود']:['🔴 خطا',t];
 const e=$('#sy');if(e)e.textContent=SY.cfg&&SY.cfg.mode!='off'?m[0]:'';const x=$('#sst');if(x)x.textContent=m[1]}
async function tick(){if(!window.desktop||!desktop.syncX||SY.busy||!SY.cfg||SY.cfg.mode=='off')return;SY.busy=1;
 try{const join=!SY.snap,ops=join?[]:df(S,SY.snap),pre=cl(S);
  const r=await desktop.syncX({cid:SY.cid,since:SY.seq,ops,join,base:join&&SY.cfg.mode=='host'?pre:undefined});
  if(!r||r.err){setSt(!r||r.err=='offline'?'off':r.err);return}
  let ch=false,snap;
  if(r.full){const keep={};LOCALK.forEach(k=>{if(S.shop&&S.shop[k]!==undefined)keep[k]=S.shop[k]});
   S=r.full;S.shop=Object.assign(S.shop||{},keep);norm();snap=cl(S);ch=true}
  else{snap=pre;const mx={};const dl=o=>o.c=='stock'||o.ds!==undefined;r.ops.forEach(o=>{if(o.o==SY.cid&&!dl(o))mx[o.c+'|'+o.k]=o.s});
   r.ops.forEach(o=>{if(o.o==SY.cid)return;if(!dl(o)&&mx[o.c+'|'+o.k]>o.s)return;ap(S,o);ap(snap,o);ch=true})}
  SY.seq=r.seq;SY.snap=snap;persist();setSt('ok');
  if(ch){save();dirty=true}
 }catch(e){setSt('off')}finally{SY.busy=0}}
async function syBoot(){if(!window.desktop||!desktop.syncCfg)return;try{SY.cfg=await desktop.syncCfg()}catch(e){return}
 setSt(SY.st);setInterval(()=>{tick();if(dirty&&!typing()){dirty=false;render()}},2000);tick()}
function syCard(){const c=SY.cfg;
 if(!window.desktop||!c)return'<div class="card"><h2>همگام‌سازی دو سیستم</h2><div class="k">این بخش فقط در نسخه‌ی ویندوزی کار می‌کند.</div></div>';
 const m=SY.ui||c.mode;
 return `<div class="card"><h2>همگام‌سازی دو سیستم (شبکه‌ی داخلی)</h2><div class="k">دو کامپیوتری که به یک مودم یا وای‌فای وصل هستند: یکی «سیستم اصلی» می‌شود و دیگری به آن وصل می‌شود. خدمات، فاکتورها، هزینه‌ها، موجودی کاغذ و بقیه‌ی اطلاعات هر دو سمت خودکار یکی می‌شود.</div>
<div class="row" style="margin-top:8px"><select id="sm" onchange="SY.ui=this.value;set()"><option value="off" ${m=='off'?'selected':''}>خاموش</option><option value="host" ${m=='host'?'selected':''}>این سیستم، «سیستم اصلی» است</option><option value="client" ${m=='client'?'selected':''}>این سیستم به سیستم اصلی وصل شود</option></select></div>
${m=='host'?`<div class="k" style="margin-top:8px">آدرس این سیستم: <b dir="ltr">${esc((c.ips||[]).join(' ، ')||'—')}</b><br>رمز اتصال: <b dir="ltr" style="font-size:20px">${esc(c.key)}</b> (این رمز و آدرس را در سیستم دوم وارد کنید)</div>`:''}
${m=='client'?`<div class="row" style="margin-top:8px"><input id="sh" dir="ltr" placeholder="آدرس سیستم اصلی، مثل 192.168.1.20" value="${esc(c.mode=='client'?c.host||'':'')}" style="min-width:230px"><input id="sk" dir="ltr" placeholder="رمز اتصال" value="${esc(c.mode=='client'?c.key||'':'')}" style="width:130px"></div>`:''}
<div class="row" style="margin-top:8px"><button class="btn" onclick="sySave()">ذخیره و اتصال</button><span id="sst" class="k"></span></div>
<div class="k" style="margin-top:6px">رمز قفل برنامه، پرینتر انتخابی، اندازه‌ی فاکتور و آدرس به‌روزرسانی روی هر سیستم جدا می‌ماند.</div></div>`}
async function sySave(){const c=SY.cfg,m=$('#sm').value,o={mode:m,port:c.port};
 if(m=='client'){o.host=$('#sh').value.trim();o.key=$('#sk').value.trim();
  if(!o.host||!o.key){alert('آدرس و رمز اتصال را وارد کنید');return}
  if(!await desktop.syncPing(o.host,c.port)){alert('به این آدرس وصل نشد. مطمئن شوید سیستم اصلی روشن است، روی «سیستم اصلی» تنظیم شده، و هر دو کامپیوتر به یک شبکه وصل‌اند (فایروال ویندوز هم باید روی سیستم اصلی اجازه بدهد).');return}
  if(!confirm('اطلاعات این سیستم با اطلاعات سیستم اصلی جایگزین می‌شود (یک بکاپ از اطلاعات فعلی ذخیره می‌شود). ادامه می‌دهید؟'))return;
  try{desktop.autoBackup(JSON.stringify({app:'ofogh-cafenet',v:1,data:S}),'pre-sync')}catch(e){}}
 SY.snap=null;SY.seq=0;persist();SY.cfg=await desktop.syncSet(o);SY.ui=null;setSt('off');tick();set()}
/*SYNC-END*/
function applyTh(){let t='system';try{t=localStorage.getItem('cafenet_theme')||'system'}catch(e){}const r=document.documentElement;t=='system'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',t);$('#th').value=t}
function setTh(t){try{localStorage.setItem('cafenet_theme',t)}catch(e){}applyTh()}
document.addEventListener('keydown',e=>{if(e.key=='Escape'){if(dpS){dpClose();return}if(paperRes){paperRes(0);return}if($('#paperAlarm').style.display=='block'){$('#paperAlarm').style.display='none';return}closeM();closeServicePicker();}
if(tab=='sale'&&(e.key=='F8'||e.key=='F9')&&$('#md').style.display!='block'&&$('#paperAsk').style.display!='block'){e.preventDefault();const a=document.activeElement;if(a&&a.blur)a.blur();finish(e.key=='F8')}});
applyTh();render();alarmBar();if(S.shop.pass)lockNow();setTimeout(()=>chkUpd(),1500);syBoot();
</script>
