<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدیریت کافی‌نت</title>
<meta name="app-version" content="2026-11-15.5">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#dde3ea;--pr:#0f4c81;--prt:#fff;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12161c;--card:#1c232c;--tx:#e8edf3;--mu:#97a3b3;--bd:#2d3744;--pr:#4f8bff;--prt:#fff;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12161c;--card:#1c232c;--tx:#e8edf3;--mu:#97a3b3;--bd:#2d3744;--pr:#4f8bff;--prt:#fff;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;font-size:15px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;background:linear-gradient(135deg,#0b2545 0%,#13538a 60%,#f59e0b 135%);color:#fff;border-bottom:3px solid #f59e0b}
header h1{font-size:18px;margin:0 0 0 12px}
nav{display:flex;gap:6px;flex-wrap:wrap}
button,input,select{font:inherit;color:inherit}
nav button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;padding:7px 14px;border-radius:8px;cursor:pointer}
nav button.on{background:#f59e0b;color:#1b2430;border-color:#f59e0b}
main{max-width:1000px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.k{color:var(--mu);font-size:13px}.v{font-size:21px;font-weight:700;margin-top:4px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
h2{font-size:16px;margin:0 0 10px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:13px}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;max-width:100%}
td input{width:90px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--pr);color:var(--prt);border:0;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:600}
.btn.g{background:transparent;color:var(--bad);border:1px solid var(--bd);padding:4px 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--bg);border-radius:20px;padding:8px 14px;cursor:pointer}
.chip:hover{border-color:var(--pr)}
#inv{display:none}
/* انتخاب خدمات به‌صورت پنجره‌ای و فشرده */
#servicePicker{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:70;padding:14px;overflow:auto}
#servicePicker .picker-box{max-width:720px;margin:4vh auto;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:0 18px 55px rgba(0,0,0,.28)}
#servicePicker .picker-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
#servicePicker .picker-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:7px;max-height:58vh;overflow:auto;padding:2px}
#servicePicker .service-option{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:right;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:9px 10px;cursor:pointer;min-width:0}
#servicePicker .service-option:hover{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 8%,var(--bg))}
#servicePicker .service-option b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#servicePicker .service-option small{font-size:11px;color:var(--mu);white-space:nowrap}
.sale-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sale-tools .btn{padding:7px 12px}
.sale-items th,.sale-items td{padding:5px 5px;font-size:13px}
.sale-items input{padding:5px 6px;width:76px}
.sale-items td:nth-child(2){max-width:180px;overflow:hidden;text-overflow:ellipsis}
@media(max-width:600px){#servicePicker{padding:7px}#servicePicker .picker-box{margin:2vh auto;padding:10px}#servicePicker .picker-list{grid-template-columns:1fr 1fr;gap:6px}.sale-tools>*{flex:1 1 auto}}

#pv{zoom:.6}
.iv{width:210mm;min-height:296mm;background:#fff;color:#111;font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl;position:relative;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:13px}
.iv .hd{background:linear-gradient(135deg,#0b2545 0%,#13538a 65%,#f59e0b 140%);color:#fff;padding:12mm 14mm;display:flex;justify-content:space-between;align-items:center;border-bottom:3mm solid #f59e0b}
.iv .hl{display:flex;gap:10px;align-items:center}.iv .sn{font-size:26px;font-weight:700}.iv .ss{font-size:12px;opacity:.85;margin-top:2px}.iv .ht{font-size:22px;font-weight:700;border:2px solid #f59e0b;border-radius:8px;padding:6px 16px;color:#fde68a}
.iv .bd{padding:10mm 14mm 40mm}
.iv .mt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8mm}
.iv .mt div{background:#f1f5f9;border-radius:8px;padding:6px 10px}.iv .mt span{display:block;color:#64748b;font-size:11px}.iv .mt b{font-size:14px}
.iv table.it{width:100%;border-collapse:collapse}
.iv .it th{background:#0b2545;color:#fff;padding:8px 6px;text-align:right}.iv .it td{padding:8px 6px;border-bottom:1px solid #e2e8f0}.iv .it tr:nth-child(even) td{background:#f8fafc}
.iv .tt{margin:8mm 0 0 auto;width:90mm;margin-inline-start:0;margin-inline-end:auto}
.iv .tt div{display:flex;justify-content:space-between;padding:6px 10px;border-bottom:1px solid #e2e8f0}.iv .tt .pay{background:#0b2545;color:#fff;border-radius:8px;margin-top:6px;font-size:15px;font-weight:700}
.iv .sg{display:flex;justify-content:space-between;margin-top:18mm;color:#475569}.iv .sg div{width:60mm;border-top:1px solid #94a3b8;padding-top:6px;text-align:center}
.iv .ft{position:absolute;bottom:0;left:0;right:0;border-top:3mm solid #f59e0b;padding:6mm 14mm;display:flex;justify-content:space-between;font-size:12px;color:#334155;background:#f8fafc}
.iv .nt{margin-top:10mm;text-align:center;border:1.5px dashed #f59e0b;background:#fffbeb;color:#92400e;border-radius:8px;padding:8px 12px;font-weight:600;line-height:1.9}
.iv .brandlogo{width:22mm;height:22mm;object-fit:contain;border-radius:5mm;background:#fff;padding:1mm}
.iv .socials{display:flex;align-items:center;gap:5mm;flex-wrap:wrap;justify-content:center;margin-top:5mm;color:#0b2545;font-size:10px}
.iv .socials span{display:inline-flex;align-items:center;gap:1.5mm}
.iv .socials i{display:inline-flex;width:6mm;height:6mm;border-radius:50%;align-items:center;justify-content:center;color:#fff;font-style:normal;font-weight:700;font-size:8px;background:#229ed9}
.iv .socials .rub{background:#7b4ce2}.iv .socials .eit{background:#18a77a}.iv .socials .bal{background:#168de2}
.logo-preview{width:90px;height:90px;object-fit:contain;border:1px dashed var(--bd);border-radius:12px;padding:5px;background:#fff}
header select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);margin-right:auto}header select option{color:#1b2430}
#ts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:10px 20px;border-radius:10px;display:none;z-index:60;font-weight:600}
.on2{border-color:var(--pr)!important;font-weight:700}
@media print{@page{size:A4;margin:0}html,body{background:#fff!important}body>*:not(#inv){display:none!important}#inv{display:block}}
</style>
</head>
<body>
<header><div id="brandMarkBox" style="width:38px;height:38px;flex:0 0 38px"><svg width="38" height="38" viewBox="0 0 34 34"><circle cx="17" cy="20" r="9" fill="#f59e0b"/><rect y="20" width="34" height="14" fill="#0b2545"/><path d="M2 21h30" stroke="#fff" stroke-width="2"/></svg></div><h1 id="hn">کافی‌نت افق</h1>
<nav id="nav"></nav><select id="th" onchange="setTh(this.value)"><option value="system">🖥️ سیستم</option><option value="light">☀️ روز</option><option value="dark">🌙 شب</option></select></header>
<div id="upd" style="display:none;background:#f59e0b;color:#1b2430;padding:8px;text-align:center;font-weight:600"></div>
<main id="app"></main>
<div id="md" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;overflow:auto;padding:12px"><div class="card" style="max-width:760px;margin:0 auto"><div class="row"><select id="pr" style="min-width:220px"></select><button class="btn" onclick="doPrint()">چاپ</button><button class="btn" onclick="doPdf()">ذخیره PDF</button><button class="btn g" onclick="closeM()">بستن</button></div><div class="wrap" style="margin-top:10px;background:#8a94a3;padding:8px"><div id="pv"></div></div></div></div>
<div id="servicePicker" onclick="if(event.target===this)closeServicePicker()"><div class="picker-box" onclick="event.stopPropagation()"><div class="picker-head"><div><h2 style="margin:0">انتخاب خدمات</h2><div class="k">خدمات به ترتیب حروف الفبا مرتب شده‌اند؛ برای افزودن روی هر خدمت بزنید.</div></div><button class="btn g" onclick="closeServicePicker()">بستن ✕</button></div><input id="serviceSearch" type="search" placeholder="جستجوی نام یا کد خدمت..." oninput="q2=this.value;renderServicePicker()" onkeydown="if(event.key==='Enter'){const l=sortedServices(q2);if(l[0])add(l[0].id)}" style="width:100%;margin-bottom:10px"><div id="servicePickerList" class="picker-list"></div></div></div>
<div id="inv"></div>
<div id="ts"></div>
<script>
const KEY='cafenet_v1';
const DEF={services:[
{id:1,n:'کپی A4',p:2000,c:400,u:1},{id:2,n:'پرینت سیاه‌سفید',p:3000,c:500,u:1},
{id:3,n:'پرینت رنگی',p:10000,c:3000,u:1},{id:4,n:'اسکن',p:5000,c:0,u:0},
{id:5,n:'نوبت‌دهی',p:50000,c:0,u:0},{id:6,n:'خدمات تعویض پلاک',p:300000,c:0,u:0}],
paper:{stock:500,low:50},sales:[],exp:[],printJobs:[],nid:10};
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||DEF}catch(e){S=DEF}
S.shop=S.shop||{name:'کافی‌نت افق',phone:'09222137612',addr:''};
S.shop.phone=S.shop.phone||'09222137612';
S.shop.logo=S.shop.logo||'';S.printJobs=S.printJobs||[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}try{window.desktop&&desktop.autoBackup(JSON.stringify({app:'ofogh-cafenet',v:1,data:S}))}catch(e){}};
function rc(){const u=new Set(S.services.map(s=>s.k));let k;do{k=String(1000+Math.floor(Math.random()*9000))}while(u.has(k));return k}
if(S.services.some(s=>!s.k)){S.services.forEach(s=>{if(!s.k)s.k=rc()});save()}
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString('fa-IR')+' تومان';
const nf=n=>Math.round(n).toLocaleString('fa-IR');
const day=t=>new Date(t).toDateString();
const jd=t=>new Date(t).toLocaleDateString('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric'});
const jt=t=>new Date(t).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab='dash',cart=[],cust='',custTitle='جناب آقای',disc=0;
const tabs=[['dash','داشبورد امروز'],['sale','فاکتور جدید'],['svc','خدمات'],['print','چاپ A4'],['stock','موجودی کاغذ'],['exp','هزینه‌ها'],['db','بانک اطلاعات'],['hist','گزارش‌ها'],['set','تنظیمات']];
function nav(){$('#nav').innerHTML=tabs.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}
function go(t){tab=t;render()}
function today(){const d=day(Date.now());const s=S.sales.filter(x=>day(x.t)==d),e=S.exp.filter(x=>day(x.t)==d);
const rev=s.reduce((a,x)=>a+x.total,0),cost=s.reduce((a,x)=>a+x.cost,0),ex=e.reduce((a,x)=>a+x.a,0);
return{s,e,rev,cost,ex,profit:rev-cost-ex}}
function render(){nav();$('#brandMarkBox').innerHTML=S.shop.logo?`<img src="${S.shop.logo}" alt="لوگو" style="width:38px;height:38px;object-fit:contain;border-radius:8px;background:#fff">`:`<svg width="38" height="38" viewBox="0 0 34 34"><circle cx="17" cy="20" r="9" fill="#f59e0b"/><rect y="20" width="34" height="14" fill="#0b2545"/><path d="M2 21h30" stroke="#fff" stroke-width="2"/></svg>`;$('#hn').textContent=S.shop.name;({dash,sale,svc,print:printTab,stock,exp,db,hist,set})[tab]()}
function dash(){const T=today(),low=S.paper.stock<=S.paper.low;
$('#app').innerHTML=`<div class="k" style="margin-bottom:10px">${jd(Date.now())}</div>
<div class="grid">
<div class="card"><div class="k">مشتری امروز</div><div class="v">${nf(T.s.length)}</div></div>
<div class="card"><div class="k">دخل امروز</div><div class="v">${fmt(T.rev)}</div></div>
<div class="card"><div class="k">هزینه امروز</div><div class="v bad">${fmt(T.ex)}</div></div>
<div class="card"><div class="k">سود خالص امروز</div><div class="v ${T.profit>=0?'ok':'bad'}">${fmt(T.profit)}</div></div>
<div class="card"><div class="k">کاغذ A4 باقی‌مانده</div><div class="v ${low?'warn':''}">${nf(S.paper.stock)} برگ</div>${low?'<div class="warn k">موجودی کم است!</div>':''}</div></div>
<div class="card"><h2>فاکتورهای امروز</h2><div class="wrap"><table><tr><th>شماره</th><th>ساعت</th><th>مشتری</th><th>مبلغ</th><th></th></tr>
${T.s.map(x=>`<tr><td>${pd(x.id)}</td><td>${jt(x.t)}</td><td>${esc(customerName(x))}</td><td>${fmt(x.total)}</td><td><button class="btn g" style="color:var(--pr)" onclick="reprint(${x.id})">چاپ</button></td></tr>`).join('')||'<tr><td colspan=5 class="k">هنوز فاکتوری ثبت نشده</td></tr>'}</table></div></div>
<div class="k">سود خالص = دخل − بهای تمام‌شده خدمات − هزینه‌های روز</div>`}
let q1='',q2='';
const pd=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const nz=s=>String(s==null?'':s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/ي/g,'ی').replace(/ك/g,'ک').toLowerCase().trim();
const fsv=q=>{q=nz(q);return S.services.filter(s=>!q||nz(s.n).includes(q)||nz(s.k).includes(q))};
const sortedServices=q=>fsv(q).sort((a,b)=>String(a.n).localeCompare(String(b.n),'fa'));
function openServicePicker(){const m=$('#servicePicker');m.style.display='block';$('#serviceSearch').value=q2;renderServicePicker();setTimeout(()=>$('#serviceSearch').focus(),30)}
function closeServicePicker(){$('#servicePicker').style.display='none'}
function renderServicePicker(){const l=sortedServices(q2);$('#servicePickerList').innerHTML=l.map(s=>`<button class="service-option" onclick="add(${s.id})"><b>${esc(s.n)}</b><small>${nf(s.p)} تومان · ${pd(s.k)}</small></button>`).join('')||'<div class="k">خدمتی پیدا نشد</div>'}
function upTot(){const sub=cart.reduce((a,x)=>a+x.q*x.p,0);$('#tot').textContent='مبلغ نهایی: '+fmt(Math.max(0,sub-disc))}
function sale(){const sub=cart.reduce((a,x)=>a+x.q*x.p,0);
$('#app').innerHTML=`<div class="card" style="padding:10px 12px"><div class="sale-tools"><button class="btn" onclick="openServicePicker()">＋ انتخاب خدمت</button><span class="k">${nf(cart.length)} قلم در فاکتور</span><span class="k" style="margin-right:auto">برای افزودن خدمات، پنجره انتخاب را باز کنید.</span></div></div>
<div class="card" style="padding:10px 12px"><h2>اقلام فاکتور</h2><div class="wrap"><table class="sale-items"><tr><th>کد</th><th>خدمت</th><th>تعداد</th><th>قیمت واحد</th><th>جمع</th><th></th></tr>
${cart.map((x,i)=>`<tr><td>${x.k?pd(x.k):'—'}</td><td title="${esc(x.n)}">${esc(x.n)}</td><td><input type="number" min="1" value="${x.q}" onchange="cart[${i}].q=Math.max(1,+this.value||1);sale()"></td><td><input type="number" min="0" value="${x.p}" onchange="cart[${i}].p=+this.value||0;sale()"></td><td>${fmt(x.q*x.p)}</td><td><button class="btn g" onclick="cart.splice(${i},1);sale()">حذف</button></td></tr>`).join('')||'<tr><td colspan=6 class="k">هنوز خدمتی انتخاب نشده است.</td></tr>'}</table></div>
<div class="row" style="margin-top:10px"><select id="ct" aria-label="عنوان مشتری" onchange="custTitle=this.value"><option ${custTitle==='جناب آقای'?'selected':''}>جناب آقای</option><option ${custTitle==='سرکار خانم'?'selected':''}>سرکار خانم</option><option ${custTitle==='شرکت'?'selected':''}>شرکت</option><option ${custTitle==='اداره'?'selected':''}>اداره</option><option value="" ${custTitle===''?'selected':''}>بدون عنوان</option></select><input id="cu" placeholder="نام مشتری (اختیاری)" value="${esc(cust)}" oninput="cust=this.value"><input id="dc" type="number" min="0" placeholder="تخفیف" value="${disc||''}" oninput="disc=+this.value||0;upTot()">
<b id="tot">مبلغ نهایی: ${fmt(Math.max(0,sub-disc))}</b><button class="btn" onclick="finish(true)">F8 · ذخیره و چاپ</button><button class="btn" style="background:var(--ok)" onclick="finish(false)">F9 · فقط ذخیره</button></div></div>`}
function add(id){const s=S.services.find(x=>x.id==id);if(!s)return;let paperUse=+s.u||0;if(paperUse===0&&confirm('برای خدمت «'+s.n+'» از کاغذ A4 استفاده می‌کنید؟\nاگر بله را بزنید، یک برگ از موجودی برای هر واحد این خدمت کسر می‌شود.'))paperUse=1;const l=cart.find(x=>x.id==id);if(l){l.q++;l.u=Math.max(+l.u||0,paperUse)}else cart.push({id,k:s.k,n:s.n,q:1,p:s.p,c:s.c,u:paperUse});const pickerOpen=$('#servicePicker').style.display==='block';sale();if(pickerOpen){$('#servicePicker').style.display='block';renderServicePicker();$('#serviceSearch').focus()} }
function genId(){const u=new Set(S.sales.map(x=>x.id));let k;do{k=10000+Math.floor(Math.random()*90000)}while(u.has(k));return k}
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>{t.style.display='none'},2600)}
function finish(pr){if(!cart.length){toast('فاکتور خالی است');return}const sub=cart.reduce((a,x)=>a+x.q*x.p,0);
const sl={id:genId(),t:Date.now(),cust,custTitle,items:cart,disc,total:Math.max(0,sub-disc),cost:cart.reduce((a,x)=>a+x.q*x.c,0)};
S.paper.stock=Math.max(0,S.paper.stock-cart.reduce((a,x)=>a+x.q*x.u,0));S.sales.push(sl);save();
cart=[];cust='';custTitle='جناب آقای';disc=0;sale();
if(pr)printInv(sl,true);else toast('فاکتور '+pd(sl.id)+' در گزارش‌ها ذخیره شد')}
let cur=null;
function customerName(sl){const n=(sl.cust||'').trim();return n?((sl.custTitle||'')?sl.custTitle+' ':'')+n:'—'}
function invHtml(sl){const sub=sl.items.reduce((a,x)=>a+x.q*x.p,0),sh=S.shop;

function addPrintJob(){const q=Math.floor(($('#ptQty').value||0));if(q<1){alert('تعداد برگ باید حداقل ۱ باشد');return}if(q>S.paper.stock){alert('موجودی کاغذ کافی نیست. موجودی فعلی: '+nf(S.paper.stock)+' برگ');return}const job={id:Date.now()+Math.floor(Math.random()*1000),t:Date.now(),type:$('#ptType').value,q,note:$('#ptNote').value.trim()};S.paper.stock-=q;S.printJobs=S.printJobs||[];S.printJobs.push(job);save();printTab();toast(nf(q)+' برگ از موجودی A4 کم شد')}
function delPrintJob(id){const i=(S.printJobs||[]).findIndex(x=>x.id==id);if(i<0)return;const x=S.printJobs[i];if(!confirm('این سابقه چاپ حذف و '+nf(x.q)+' برگ به موجودی برگردانده شود؟'))return;S.paper.stock+=(+x.q||0);S.printJobs.splice(i,1);save();printTab();toast('موجودی کاغذ برگشت داده شد')}
function stock(){$('#app').innerHTML=`<div class="card"><h2>موجودی کاغذ A4</h2><div class="v">${nf(S.paper.stock)} برگ <span class="k">(${nf(S.paper.stock/500)} بسته ۵۰۰ برگی)</span></div>
<div class="row" style="margin-top:12px"><input id="pa" type="number" placeholder="تعداد برگ"><button class="btn" onclick="pap(1)">افزودن به موجودی</button><button class="btn" onclick="pap(0)">تنظیم موجودی دقیق</button></div>

function exp(){const T=today();$('#app').innerHTML=`<div class="card"><h2>ثبت هزینه</h2><div class="row"><input id="et" placeholder="شرح (مثلاً برق، تونر، کاغذ)"><input id="ea" type="number" placeholder="مبلغ"><button class="btn" onclick="addExp()">ثبت</button></div></div>

let hs='sum',hd=null;
const dv=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

function histExp(){const a=sod(hd||Date.now()),b=new Date(a);b.setDate(b.getDate()+1);

$('#app').innerHTML=htabs()+`<div class="card"><h2>هزینه‌های یک روز</h2><div class="row"><button class="btn g" style="color:var(--pr)" onclick="shd(-1)">روز قبل</button><input type="date" value="${dv(a)}" onchange="if(this.value){hd=new Date(this.value+'T00:00').getTime();hist()}"><button class="btn g" style="color:var(--pr)" onclick="shd(1)">روز بعد</button><b>${jd(a)}</b></div>

function hist(){if(hs=='exp')return histExp();
const m={};S.sales.forEach(x=>{const k=day(x.t);m[k]=m[k]||{t:x.t,n:0,r:0,c:0,e:0};m[k].n++;m[k].r+=x.total;m[k].c+=x.cost});
S.exp.forEach(x=>{const k=day(x.t);m[k]=m[k]||{t:x.t,n:0,r:0,c:0,e:0};m[k].e+=x.a});
const rows=Object.values(m).sort((a,b)=>b.t-a.t);

${rows.map(r=>`<tr><td>${jd(r.t)}</td><td>${nf(r.n)}</td><td>${fmt(r.r)}</td><td>${fmt(r.e)}</td><td class="${r.r-r.c-r.e>=0?'ok':'bad'}">${fmt(r.r-r.c-r.e)}</td></tr>`).join('')||'<tr><td colspan=5 class="k">هنوز داده‌ای نیست</td></tr>'}</table></div></div>`}
let rg=null;
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const jday=t=>+new Intl.DateTimeFormat('en-u-ca-persian',{day:'numeric'}).format(new Date(t));
const jstart=t=>{const d=new Date(sod(t));d.setDate(d.getDate()-(jday(t)-1));return d.getTime()};
const jnext=s=>{const d=new Date(s);d.setDate(d.getDate()+27);while(jday(d)!=1)d.setDate(d.getDate()+1);return d.getTime()};
function rng(k){const n=Date.now(),s=sod(n),d=o=>{const x=new Date(s);x.setDate(x.getDate()+o);return x.getTime()};
if(k=='t')rg=[s,d(1)];if(k=='y')rg=[d(-1),s];if(k=='w')rg=[d(-6),d(1)];
if(k=='m'){const a=jstart(n);rg=[a,jnext(a)]}
if(k=='p'){const a=jstart(n);rg=[jstart(a-864e5),a]}
db()}
function cr(){const a=$('#d1').value,b=$('#d2').value;if(a&&b){rg=[new Date(a+'T00:00').getTime(),new Date(b+'T00:00').getTime()+864e5];db()}}

function delE(t,a){if(!confirm('این هزینه حذف شود؟'))return;const i=S.exp.findIndex(x=>x.t==t&&x.a==a);if(i>-1){S.exp.splice(i,1);save();render()}}
function db(){if(!rg){rng('m');return}
const s=S.sales.filter(x=>x.t>=rg[0]&&x.t<rg[1]),e=S.exp.filter(x=>x.t>=rg[0]&&x.t<rg[1]).sort((a,b)=>a.t-b.t);
const rev=s.reduce((a,x)=>a+x.total,0),cost=s.reduce((a,x)=>a+x.cost,0),ex=e.reduce((a,x)=>a+x.a,0);
const m={};s.forEach(x=>{const k=day(x.t);m[k]=m[k]||{t:x.t,n:0,r:0,c:0,e:0};m[k].n++;m[k].r+=x.total;m[k].c+=x.cost});
e.forEach(x=>{const k=day(x.t);m[k]=m[k]||{t:x.t,n:0,r:0,c:0,e:0};m[k].e+=x.a});
const rows=Object.values(m).sort((a,b)=>a.t-b.t);

<div class="row" style="margin-top:10px"><span>از</span><input id="d1" type="date" onchange="cr()"><span>تا</span><input id="d2" type="date" onchange="cr()"></div>
<div class="k" style="margin-top:8px">${jd(rg[0])} تا ${jd(rg[1]-1)}</div></div>
<div class="grid"><div class="card"><div class="k">مشتری</div><div class="v">${nf(s.length)}</div></div><div class="card"><div class="k">دخل</div><div class="v">${fmt(rev)}</div></div>
<div class="card"><div class="k">جمع هزینه‌ها</div><div class="v bad">${fmt(ex)}</div></div><div class="card"><div class="k">سود خالص</div><div class="v ${rev-cost-ex>=0?'ok':'bad'}">${fmt(rev-cost-ex)}</div></div></div>
<div class="card"><h2>به تفکیک روز</h2><div class="wrap"><table><tr><th>تاریخ</th><th>مشتری</th><th>دخل</th><th>هزینه</th><th>سود</th></tr>
${rows.map(r=>`<tr><td>${jd(r.t)}</td><td>${nf(r.n)}</td><td>${fmt(r.r)}</td><td>${fmt(r.e)}</td><td class="${r.r-r.c-r.e>=0?'ok':'bad'}">${fmt(r.r-r.c-r.e)}</td></tr>`).join('')||'<tr><td colspan=5 class="k">داده‌ای در این بازه نیست</td></tr>'}</table></div></div>
<div class="card"><h2>فاکتورها</h2><div class="wrap"><table><tr><th>شماره</th><th>تاریخ</th><th>مشتری</th><th>مبلغ</th><th></th></tr>${s.map(x=>`<tr><td>${pd(x.id)}</td><td>${jd(x.t)}</td><td>${esc(customerName(x))}</td><td>${fmt(x.total)}</td><td><div class="row"><button class="btn g" style="color:var(--pr)" onclick="reprint(${x.id})">چاپ</button><button class="btn g" onclick="delSale(${x.id})">حذف</button></div></td></tr>`).join('')||'<tr><td colspan=5 class="k">فاکتوری نیست</td></tr>'}</table></div></div>

<input placeholder="نام" value="${esc(S.shop.name)}" onchange="S.shop.name=this.value;save();render()"><input placeholder="تلفن" value="${esc(S.shop.phone||'09222137612')}" onchange="S.shop.phone=this.value;save()"><input style="min-width:240px" placeholder="آدرس" value="${esc(S.shop.addr)}" onchange="S.shop.addr=this.value;save()"><input style="min-width:240px" placeholder="متن پایین فاکتور" value="${esc(S.shop.foot||'')}" onchange="S.shop.foot=this.value;save()"></div></div>
${window.desktop?`<div class="card"><h2>به‌روزرسانی برنامه</h2><div class="k">فایل index.html جدید را که از چت دریافت کرده‌اید انتخاب کنید. اطلاعات شما حفظ می‌شود.</div><div class="k" style="margin-top:6px">نسخه‌ی فعلی: ${VER}</div><div class="row" style="margin-top:8px"><input style="min-width:280px;flex:1" placeholder="آدرس فایل آنلاین (https://...)" value="${esc(S.shop.updUrl||'')}" onchange="S.shop.updUrl=this.value.trim();save()"><button class="btn" onclick="chkUpd(true)">بررسی به‌روزرسانی آنلاین</button></div><div class="row" style="margin-top:8px"><button class="btn" onclick="desktop.updateUI()">انتخاب فایل و به‌روزرسانی</button><button class="btn g" onclick="confirm('بازگشت به نسخه‌ی اولیه نصب‌شده؟')&&desktop.resetUI()">بازگشت به نسخه‌ی نصب‌شده</button></div></div>`:''}
<div class="card"><h2>پشتیبان‌گیری و بازیابی</h2>${window.desktop?`<div class="k">همه‌ی خدمات، فاکتورها، هزینه‌ها و تنظیمات در یک فایل ذخیره می‌شود. فایل را جای امنی (فلش یا ایمیل) نگه دارید تا اگر برنامه پاک شد، دوباره بازیابی کنید. برنامه خودش هم هر روز یک نسخه در پوشه‌ی Documents > Ofogh Cafenet Backups ذخیره می‌کند.</div><div class="row" style="margin-top:8px"><button class="btn" onclick="bkSave()">ذخیره‌ی بکاپ در فایل</button><button class="btn" onclick="bkLoad()">بازیابی از فایل بکاپ</button></div>`:`<div class="k">متن زیر را کپی و نگه دارید. برای بازیابی، آن را در کادر دوم بچسبانید.</div>
<textarea readonly style="width:100%;height:80px;margin:8px 0;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px">${esc(JSON.stringify(S))}</textarea>
<textarea id="bk" placeholder="پشتیبان را اینجا بچسبانید" style="width:100%;height:60px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px"></textarea>
<button class="btn" style="margin-top:8px" onclick="try{S=JSON.parse($('#bk').value);save();render()}catch(e){alert('فایل پشتیبان معتبر نیست')}">بازیابی</button>`}</div>`}
function uploadLogo(input){const f=input.files&&input.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('لطفاً یک فایل تصویری انتخاب کنید');return}if(f.size>3*1024*1024){alert('حجم لوگو باید کمتر از ۳ مگابایت باشد');return}const r=new FileReader();r.onload=()=>{S.shop.logo=String(r.result);save();set();toast('لوگو ذخیره شد')};r.readAsDataURL(f)}
function removeLogo(){if(!S.shop.logo)return;if(!confirm('لوگوی فعلی حذف شود؟'))return;S.shop.logo='';save();set()}
async function bkSave(){const d=new Date().toISOString().slice(0,10);const p=await desktop.saveBackup(JSON.stringify({app:'ofogh-cafenet',v:1,data:S}),`ofogh-backup-${d}.json`);if(p)alert('بکاپ ذخیره شد:\n'+p)}
async function bkLoad(){const t=await desktop.loadBackup();if(!t)return;try{const j=JSON.parse(t),D=j.data||j;if(!Array.isArray(D.services)||!Array.isArray(D.sales))throw 0;if(!confirm('اطلاعات فعلی با بکاپ جایگزین می‌شود. ادامه؟'))return;S=D;S.shop=S.shop||{name:'کافی‌نت افق',phone:'09222137612',addr:''};
S.shop.phone=S.shop.phone||'09222137612';
S.shop.logo=S.shop.logo||'';S.printJobs=S.printJobs||[];S.exp=S.exp||[];S.paper=S.paper||{stock:0,low:50};S.nid=S.nid||100;save();render();alert('بازیابی انجام شد')}catch(e){alert('فایل بکاپ معتبر نیست')}}
const VER=(document.querySelector('meta[name=app-version]')||{}).content||'0';
let pend=null;
async function chkUpd(manual){const u=(S.shop.updUrl||'').trim();
if(!window.desktop||!u){if(manual)alert(window.desktop?'ابتدا آدرس به‌روزرسانی را وارد کنید':'این بخش فقط در نسخه‌ی ویندوزی کار می‌کند');return}
if(!u.startsWith('https://')){if(manual)alert('آدرس باید با https:// شروع شود');return}
try{const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const t=await r.text();
const m=t.match(/name="app-version" content="([^"]+)"/);if(!m||!t.includes('cafenet_v1'))throw 0;
if(m[1]>VER){pend=t;const b=$('#upd');b.style.display='block';b.innerHTML='نسخه‌ی جدید ('+esc(m[1])+') آماده است <button class="btn" style="margin-right:10px" onclick="applyUpd()">به‌روزرسانی همین حالا</button>'}
else if(manual)alert('برنامه به‌روز است')}
catch(e){if(manual)alert('دریافت به‌روزرسانی ممکن نشد. اینترنت و آدرس را بررسی کنید.')}}
async function applyUpd(){if(pend)await desktop.applyUI(pend)}
function applyTh(){let t='system';try{t=localStorage.getItem('cafenet_theme')||'system'}catch(e){}const r=document.documentElement;t=='system'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',t);$('#th').value=t}
function setTh(t){try{localStorage.setItem('cafenet_theme',t)}catch(e){}applyTh()}
document.addEventListener('keydown',e=>{if(e.key=='Escape'){closeM();closeServicePicker();}
if(tab=='sale'&&(e.key=='F8'||e.key=='F9')&&$('#md').style.display!='block'){e.preventDefault();const a=document.activeElement;if(a&&a.blur)a.blur();finish(e.key=='F8')}});
applyTh();render();setTimeout(()=>chkUpd(),1500);
</script>
</body>
</html>
